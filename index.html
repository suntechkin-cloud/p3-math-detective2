<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>審題小偵探｜香港小三數學應用題深度變奏版</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --accent: #f59e0b;
      --accent-soft: #fef3c7;
      --success: #16a34a;
      --success-soft: #dcfce7;
      --danger: #dc2626;
      --danger-soft: #fee2e2;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --radius: 16px;
      --shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang HK", "Microsoft JhengHei", sans-serif;
      background: linear-gradient(180deg, #eef4ff 0%, var(--bg) 260px);
      color: var(--text);
      line-height: 1.65;
    }

    .container {
      max-width: 920px;
      margin: 0 auto;
      padding: 20px 16px 60px;
    }

    header {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand h1 {
      margin: 0 0 4px;
      font-size: 1.5rem;
      color: var(--primary-dark);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .stats {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .stat-pill {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 14px;
      text-align: center;
      min-width: 88px;
    }

    .stat-pill .num {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--primary);
      display: block;
    }

    .stat-pill .lbl {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .toolbar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 18px;
      margin-bottom: 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: var(--shadow);
    }

    .toolbar-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    label {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
    }

    select, button, input[type="number"], input[type="text"] {
      font-family: inherit;
      font-size: 0.95rem;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      padding: 8px 12px;
      background: #fff;
      color: var(--text);
    }

    button {
      cursor: pointer;
      font-weight: 600;
      transition: all 0.15s ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-dark);
    }

    .btn-accent {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .btn-outline {
      background: #fff;
      color: var(--text);
    }

    .btn-success {
      background: var(--success);
      color: #fff;
      border-color: var(--success);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }

    .badge-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .badge {
      font-size: 0.8rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      background: #e0e7ff;
      color: var(--primary-dark);
    }

    .badge.trap {
      background: var(--accent-soft);
      color: #92400e;
    }

    .problem-box {
      background: #f8fafc;
      border-left: 5px solid var(--primary);
      border-radius: 12px;
      padding: 18px 20px;
      font-size: 1.16rem;
      margin-bottom: 10px;
    }

    .sentence {
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 6px;
      transition: background 0.15s ease;
    }

    .sentence:hover {
      background: #e2e8f0;
    }

    .sentence.marked {
      background: #fde047;
      color: #0f172a;
      font-weight: 600;
    }

    .hint-tip {
      font-size: 0.88rem;
      color: var(--muted);
      margin-bottom: 18px;
    }

    .steps {
      display: grid;
      gap: 16px;
    }

    .step-box {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      background: #ffffff;
    }

    .step-box.locked {
      background: #f8fafc;
      opacity: 0.65;
    }

    .step-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      font-weight: 700;
      font-size: 1.05rem;
    }

    .step-tag {
      font-size: 0.78rem;
      padding: 3px 9px;
      border-radius: 8px;
      background: #f1f5f9;
      color: var(--muted);
    }

    .step-tag.done {
      background: var(--success-soft);
      color: var(--success);
    }

    .options-grid {
      display: grid;
      gap: 10px;
      margin-top: 10px;
    }

    .option-btn {
      text-align: left;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1.5px solid #cbd5e1;
      background: #fff;
      font-size: 0.98rem;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: #eff6ff;
    }

    .option-btn.correct {
      border-color: var(--success);
      background: var(--success-soft);
      color: #14532d;
    }

    .option-btn.wrong {
      border-color: var(--danger);
      background: var(--danger-soft);
      color: #7f1d1d;
    }

    .diagram-wrap {
      margin: 14px 0;
      padding: 14px;
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      border-radius: 12px;
      overflow-x: auto;
    }

    .answer-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
    }

    .answer-row input[type="number"] {
      width: 150px;
      font-size: 1.1rem;
      font-weight: 700;
    }

    .feedback {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.95rem;
      display: none;
    }

    .feedback.show {
      display: block;
    }

    .feedback.ok {
      background: var(--success-soft);
      color: #14532d;
      border: 1px solid #86efac;
    }

    .feedback.err {
      background: var(--danger-soft);
      color: #7f1d1d

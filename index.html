<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>審題小偵探｜香港小三數學應用題深度變奏版</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --accent: #f59e0b;
      --accent-soft: #fef3c7;
      --success: #16a34a;
      --success-soft: #dcfce7;
      --danger: #dc2626;
      --danger-soft: #fee2e2;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --radius: 16px;
      --shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang HK", "Microsoft JhengHei", sans-serif;
      background: linear-gradient(180deg, #eef4ff 0%, var(--bg) 260px);
      color: var(--text);
      line-height: 1.65;
    }

    .container {
      max-width: 920px;
      margin: 0 auto;
      padding: 20px 16px 60px;
    }

    header {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand h1 {
      margin: 0 0 4px;
      font-size: 1.5rem;
      color: var(--primary-dark);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .stats {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .stat-pill {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 14px;
      text-align: center;
      min-width: 88px;
    }

    .stat-pill .num {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--primary);
      display: block;
    }

    .stat-pill .lbl {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .toolbar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 18px;
      margin-bottom: 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: var(--shadow);
    }

    .toolbar-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    label {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
    }

    select, button, input[type="number"], input[type="text"] {
      font-family: inherit;
      font-size: 0.95rem;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      padding: 8px 12px;
      background: #fff;
      color: var(--text);
    }

    button {
      cursor: pointer;
      font-weight: 600;
      transition: all 0.15s ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-dark);
    }

    .btn-accent {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .btn-outline {
      background: #fff;
      color: var(--text);
    }

    .btn-success {
      background: var(--success);
      color: #fff;
      border-color: var(--success);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }

    .badge-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .badge {
      font-size: 0.8rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      background: #e0e7ff;
      color: var(--primary-dark);
    }

    .badge.trap {
      background: var(--accent-soft);
      color: #92400e;
    }

    .problem-box {
      background: #f8fafc;
      border-left: 5px solid var(--primary);
      border-radius: 12px;
      padding: 18px 20px;
      font-size: 1.16rem;
      margin-bottom: 10px;
    }

    .sentence {
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 6px;
      transition: background 0.15s ease;
    }

    .sentence:hover {
      background: #e2e8f0;
    }

    .sentence.marked {
      background: #fde047;
      color: #0f172a;
      font-weight: 600;
    }

    .hint-tip {
      font-size: 0.88rem;
      color: var(--muted);
      margin-bottom: 18px;
    }

    .steps {
      display: grid;
      gap: 16px;
    }

    .step-box {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      background: #ffffff;
    }

    .step-box.locked {
      background: #f8fafc;
      opacity: 0.65;
    }

    .step-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      font-weight: 700;
      font-size: 1.05rem;
    }

    .step-tag {
      font-size: 0.78rem;
      padding: 3px 9px;
      border-radius: 8px;
      background: #f1f5f9;
      color: var(--muted);
    }

    .step-tag.done {
      background: var(--success-soft);
      color: var(--success);
    }

    .options-grid {
      display: grid;
      gap: 10px;
      margin-top: 10px;
    }

    .option-btn {
      text-align: left;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1.5px solid #cbd5e1;
      background: #fff;
      font-size: 0.98rem;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: #eff6ff;
    }

    .option-btn.correct {
      border-color: var(--success);
      background: var(--success-soft);
      color: #14532d;
    }

    .option-btn.wrong {
      border-color: var(--danger);
      background: var(--danger-soft);
      color: #7f1d1d;
    }

    .diagram-wrap {
      margin: 14px 0;
      padding: 14px;
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      border-radius: 12px;
      overflow-x: auto;
    }

    .answer-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
    }

    .answer-row input[type="number"] {
      width: 150px;
      font-size: 1.1rem;
      font-weight: 700;
    }

    .feedback {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.95rem;
      display: none;
    }

    .feedback.show {
      display: block;
    }

    .feedback.ok {
      background: var(--success-soft);
      color: #14532d;
      border: 1px solid #86efac;
    }

    .feedback.err {
      background: var(--danger-soft);
      color: #7f1d1d;
      border: 1px solid #fca5a5;
    }

    .solution-box {
      margin-top: 16px;
      padding: 18px;
      border-radius: 14px;
      background: #f0fdf4;
      border: 1px solid #86efac;
      display: none;
    }

    .solution-box.show {
      display: block;
    }

    .mistakes-list {
      display: grid;
      gap: 10px;
      margin-top: 12px;
    }

    .mistake-item {
      padding: 12px 14px;
      border-radius: 10px;
      background: #fff7ed;
      border: 1px solid #fed7aa;
      font-size: 0.92rem;
    }

    @media (max-width: 600px) {
      .problem-box {
        font-size: 1.05rem;
      }
      .card, header {
        padding: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <h1>🕵️‍♂️ 審題小偵探（小三深度變奏版）</h1>
        <p>拆解多變問法、看穿干擾條件與餘數陷阱，再畫圖列式！</p>
      </div>
      <div class="stats">
        <div class="stat-pill">
          <span class="num" id="statSolved">0</span>
          <span class="lbl">已破案題數</span>
        </div>
        <div class="stat-pill">
          <span class="num" id="statStreak">0</span>
          <span class="lbl">連續答對</span>
        </div>
        <div class="stat-pill">
          <span class="num" id="statStars">0</span>
          <span class="lbl">偵探星星</span>
        </div>
      </div>
    </header>

    <div class="toolbar">
      <div class="toolbar-group">
        <label for="typeFilter">專攻題型：</label>
        <select id="typeFilter">
          <option value="all">全部變奏題型（隨機挑戰）</option>
          <option value="reverse_restore">反向還原：由「剩餘＋花費」求原本</option>
          <option value="remainder_twist">餘數雙重變奏：進一法 vs 去尾法</option>
          <option value="compare_shift">比較變奏：問相差、總和或「少幾多」</option>
          <option value="multi_distractor">雙重陷阱：干擾數字＋看清提問對象</option>
          <option value="unit_cross">跨單位進階：元與角／升與毫升／時與分</option>
        </select>
      </div>
      <div class="toolbar-group">
        <button class="btn-accent" id="btnNewProblem">🔄 換一題變奏題</button>
        <button class="btn-outline" id="btnResetStats">重設紀錄</button>
      </div>
    </div>

    <main class="card">
      <div class="badge-row">
        <span class="badge" id="problemCategory">題型</span>
        <span class="badge trap" id="problemFocusTag">審題重點</span>
      </div>

      <div class="problem-box" id="problemText"></div>
      <div class="hint-tip">💡 點擊題目中任何一句話，可以用黃色螢光筆標記「真正問題」或「關鍵數字」！</div>

      <div class="steps">
        <div class="step-box" id="step1Box">
          <div class="step-header">
            <span>第一步：拆解題意與真正所求</span>
            <span class="step-tag" id="step1Tag">進行中</span>
          </div>
          <div id="step1Prompt"></div>
          <div class="options-grid" id="step1Options"></div>
          <div class="feedback" id="step1Feedback"></div>
        </div>

        <div class="step-box locked" id="step2Box">
          <div class="step-header">
            <span>第二步：看線段圖，選對計算邏輯</span>
            <span class="step-tag" id="step2Tag">未解鎖</span>
          </div>
          <div class="diagram-wrap" id="diagramArea"></div>
          <div id="step2Prompt">請先完成第一步審題，即可解鎖線段圖與列式選擇。</div>
          <div class="options-grid" id="step2Options"></div>
          <div class="feedback" id="step2Feedback"></div>
        </div>

        <div class="step-box locked" id="step3Box">
          <div class="step-header">
            <span>第三步：輸入最終數字與單位</span>
            <span class="step-tag" id="step3Tag">未解鎖</span>
          </div>
          <div id="step3Prompt">請先完成第二步列式，再輸入最終答案。</div>
          <div class="answer-row" id="answerInputRow" style="display:none;">
            <input type="number" id="userAnswerInput" placeholder="輸入數字" />
            <select id="userUnitSelect"></select>
            <button class="btn-success" id="btnCheckAnswer">核對答案</button>
          </div>
          <div class="feedback" id="step3Feedback"></div>
        </div>
      </div>

      <div class="solution-box" id="solutionBox"></div>

      <div style="margin-top: 20px; display: flex; justify-content: flex-end; gap: 10px;">
        <button class="btn-primary" id="btnNextProblem" disabled>下一道深度變奏題 ➡️</button>
      </div>
    </main>

    <section class="card">
      <h2 style="margin: 0 0 6px; font-size: 1.15rem;">📓 審題錯題本（記錄容易看錯的陷阱）</h2>
      <p style="margin: 0; color: var(--muted); font-size: 0.9rem;">每次答錯審題、列式或答案，系統會自動記在這裡，方便重溫易錯點。</p>
      <div class="mistakes-list" id="mistakesList">
        <div style="color: var(--muted); font-size: 0.92rem;">目前未有錯題，繼續保持細心！</div>
      </div>
    </section>
  </div>

  <script>
    const names = ["家朗", "詩詠", "子軒", "曉彤", "柏宇", "嘉怡", "俊傑", "卓琳", "晞彤", "睿希"];
    const randInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
    const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
    const shuffle = (arr) => {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    };

    const state = {
      solved: 0,
      streak: 0,
      stars: 0,
      mistakes: [],
      current: null,
      step1Done: false,
      step2Done: false,
      step3Done: false,
      recordedMistakeThisRound: false
    };

    function saveState() {
      localStorage.setItem("p3_math_detective_v2", JSON.stringify({
        solved: state.solved,
        streak: state.streak,
        stars: state.stars,
        mistakes: state.mistakes
      }));
    }

    function loadState() {
      try {
        const raw = JSON.parse(localStorage.getItem("p3_math_detective_v2"));
        if (raw) {
          state.solved = raw.solved || 0;
          state.streak = raw.streak || 0;
          state.stars = raw.stars || 0;
          state.mistakes = Array.isArray(raw.mistakes) ? raw.mistakes : [];
        }
      } catch (e) {}
      renderStats();
      renderMistakes();
    }

    function renderStats() {
      document.getElementById("statSolved").textContent = state.solved;
      document.getElementById("statStreak").textContent = state.streak;
      document.getElementById("statStars").textContent = state.stars;
    }

    function recordMistake(reason) {
      if (state.recordedMistakeThisRound || !state.current) return;
      state.recordedMistakeThisRound = true;
      state.mistakes.unshift({
        category: state.current.category,
        question: state.current.fullQuestionText,
        reason
      });
      if (state.mistakes.length > 25) state.mistakes.pop();
      saveState();
      renderMistakes();
    }

    function renderMistakes() {
      const el = document.getElementById("mistakesList");
      if (!state.mistakes.length) {
        el.innerHTML = `<div style="color: var(--muted); font-size: 0.92rem;">目前未有錯題，繼續保持細心！</div>`;
        return;
      }
      el.innerHTML = state.mistakes.map(m => `
        <div class="mistake-item">
          <strong>【${m.category}】</strong> ${m.question}<br/>
          <span style="color:#9a3412;">審題提醒：${m.reason}</span>
        </div>
      `).join("");
    }

    const generators = {
      reverse_restore() {
        const n = pick(names);
        const item = pick(["模型車", "繪本", "拼圖", "羽毛球筒"]);
        const unit = pick(["輛", "本", "盒", "筒"]);
        const price = randInt(16, 38);
        const qty = randInt(2, 4);
        const left = randInt(15, 55);
        const spent = price * qty;
        const original = spent + left;
        const extraInfo = randInt(12, 28);

        const sentences = shuffle([
          `${n}買了 ${qty} ${unit}${item}，每${unit} $${price}。`,
          `付錢後錢包裡還剩下 ${left} 元。`,
          `同場另有每件 $${extraInfo} 的貼紙包，但${n}沒有購買。`
        ]);
        sentences.push(`請問${n}出門前原本帶了多少元？`);

        return {
          type: "reverse_restore",
          category: "反向還原：求原本總數",
          focusTag: "「還剩」也要加回去！",
          sentences,
          fullQuestionText: sentences.join(""),
          step1Prompt: `題目給了「買 ${qty} ${unit}（每${unit} $${price}）」和「還剩 ${left} 元」，要算「原本有多少元」，應該怎麼想？`,
          step1Options: shuffle([
            { text: `原本的錢 ＝ 用去的錢（${price} × ${qty}）＋ 剩下的錢（${left}）`, correct: true, tip: `太準確了！原本的錢分成「花掉的」和「剩下的」兩部分，合起來才是原本總數。` },
            { text: `原本的錢 ＝ 用去的錢（${price} × ${qty}）－ 剩下的錢（${left}）`, correct: false, tip: `如果減去剩下的錢，算出的就不是出門前原有的錢了。` },
            { text: `直接用 ${left} 加上貼紙包 $${extraInfo}`, correct: false, tip: `${n}沒有買貼紙包，而且別忘了先算買 ${qty} ${unit}${item}花了多少錢。` }
          ]),
          diagramSvg: `
            <svg width="100%" height="88" viewBox="0 0 460 88">
              <text x="10" y="25" font-size="13" fill="#1e293b" font-weight="bold">出門前原有 ？元</text>
              <rect x="135" y="10" width="185" height="24" rx="4" fill="#fde68a" stroke="#d97706"/>
              <text x="227" y="27" font-size="12" text-anchor="middle">買 ${qty} ${unit}（共 ${spent} 元）</text>
              <rect x="320" y="10" width="125" height="24" rx="4" fill="#bfdbfe" stroke="#2563eb"/>
              <text x="382" y="27" font-size="12" text-anchor="middle">還剩 ${left} 元</text>
              <text x="135" y="58" font-size="12" fill="#64748b">（干擾：未買的貼紙 $${extraInfo} 不計入）</text>
            </svg>
          `,
          step2Prompt: "哪一條算式正確？",
          step2Options: shuffle([
            { text: `${price} × ${qty} + ${left}`, correct: true, tip: `先算買 ${item} 花了 ${spent} 元，再加上剩下的 ${left} 元。` },
            { text: `${price} × ${qty} - ${left}`, correct: false, tip: `花掉的錢加上剩下的錢才是原本的錢，不是相減。` },
            { text: `${price} + ${qty} + ${left}`, correct: false, tip: `${qty} ${unit}每${unit} $${price}，要用乘法算花費。` }
          ]),
          answer: original,
          units: ["元", "角", unit],
          correctUnit: "元",
          explanation: `買 ${qty} ${unit}${item}用去 ${price} × ${qty} = ${spent} 元，加上還剩的 ${left} 元，出門前原有 ${spent} + ${left} = ${original} 元。`
        };
      },

      remainder_twist() {
        const mode = pick(["ceil", "floor"]);
        const cap = randInt(4, 7);
        const q = randInt(4, 8);
        const rem = randInt(1, cap - 1);
        const total = cap * q + rem;

        if (mode === "ceil") {
          const ans = q + 1;
          const sentences = [
            `學校旅行安排小巴，每輛小巴最多可載 ${cap} 名師生。`,
            `參加旅行的共有 ${total} 人。`,
            `為了讓每一位參加者都能坐車出發，最少需要安排多少輛小巴？`
          ];
          return {
            type: "remainder_twist",
            category: "餘數變奏：進一法（最少需要）",
            focusTag: `餘 ${rem} 人不能丟下 → ＋1`,
            sentences,
            fullQuestionText: sentences.join(""),
            step1Prompt: `${total} ÷ ${cap} ＝ ${q} 餘 ${rem}。題目要求「每一位都能坐車」，這餘下的 ${rem} 人怎麼處理？`,
            step1Options: shuffle([
              { text: `要多安排 1 輛小巴載這 ${rem} 人，所以是 ${q} ＋ 1 ＝ ${ans} 輛`, correct: true, tip: `對！少 1 輛就會有人沒車坐，所以餘數要進一。` },
              { text: `直接寫 ${q} 輛，餘數不用理會`, correct: false, tip: `如果只安排 ${q} 輛，會有 ${rem} 人上不了車！` },
              { text: `只安排 ${rem} 輛`, correct: false, tip: `${rem} 是餘下的人數，不是小巴數量。` }
            ]),
            diagramSvg: `
              <svg width="100%" height="80" viewBox="0 0 460 80">
                <text x="10" y="28" font-size="13" fill="#1e293b" font-weight="bold">共 ${total} 人</text>
                <rect x="95" y="12" width="225" height="24" rx="4" fill="#dbeafe" stroke="#2563eb"/>
                <text x="207" y="29" font-size="12" text-anchor="middle">${q} 輛坐滿（每輛 ${cap} 人）</text>
                <rect x="326" y="12" width="122" height="24" rx="4" fill="#fecaca" stroke="#dc2626"/>
                <text x="387" y="29" font-size="12" text-anchor="middle" fill="#991b1b">剩 ${rem} 人 → ＋1 輛</text>
              </svg>
            `,
            step2Prompt: "選擇正確的計算步驟：",
            step2Options: shuffle([

          const l = randInt(2, 4);
          const ml = randInt(200, 700);
          const drinkMl = randInt(250, 600);
          const totalMl = l * 1000 + ml;
          const remainMl = totalMl - drinkMl;
          const sentences = [
            `水壺裡原本裝了 ${l} 升 ${ml} 毫升清水。`,
            `午飯時倒出了 ${drinkMl} 毫升。`,
            `請問水壺裡還剩下多少毫升清水？`
          ];
          return {
            type: "unit_cross",
            category: "跨單位進階：升與毫升換算",
            focusTag: "1 升 ＝ 1000 毫升，答案問「毫升」",
            sentences,
            fullQuestionText: sentences.join(""),
            step1Prompt: "計算前，怎樣把「升」和「毫升」統一？",
            step1Options: shuffle([
              { text: `1 升 ＝ 1000 毫升，${l} 升 ${ml} 毫升 ＝ ${totalMl} 毫升，再減去 ${drinkMl} 毫升`, correct: true, tip: `非常正確！升化毫升要乘以 1000。` },
              { text: `1 升 ＝ 100 毫升，所以是 ${l * 100 + ml} 毫升`, correct: false, tip: `小心！1 升等於 1000 毫升，不是 100 毫升。` },
              { text: `用 ${totalMl} 加上 ${drinkMl}`, correct: false, tip: `倒出是減少，問「還剩下」要用減法。` }
            ]),
            diagramSvg: `
              <svg width="100%" height="80" viewBox="0 0 460 80">
                <text x="10" y="28" font-size="13" font-weight="bold">原有 ${totalMl} mL</text>
                <rect x="130" y="12" width="120" height="24" rx="4" fill="#fecaca" stroke="#dc2626"/>
                <text x="190" y="29" font-size="12" text-anchor="middle">倒出 ${drinkMl} mL</text>
                <rect x="250" y="12" width="195" height="24" rx="4" fill="#bbf7d0" stroke="#16a34a"/>
                <text x="347" y="29" font-size="12" text-anchor="middle">還剩 ？mL</text>
              </svg>
            `,
            step2Prompt: "選擇正確算式：",
            step2Options: shuffle([
              { text: `${totalMl} - ${drinkMl}`, correct: true, tip: `${totalMl} 毫升減去倒出的 ${drinkMl} 毫升。` },
              { text: `${totalMl} + ${drinkMl}`, correct: false, tip: `倒出後水會變少，不是相加。` },
              { text: `${drinkMl} - ${totalMl}`, correct: false, tip: `原有水量較多，應放在減號前面。` }
            ]),
            answer: remainMl,
            units: ["毫升", "升", "厘米"],
            correctUnit: "毫升",
            explanation: `${l} 升 ${ml} 毫升 = ${totalMl} 毫升，倒出 ${drinkMl} 毫升後，還剩下 ${totalMl} - ${drinkMl} = ${remainMl} 毫升。`
          };
        } else {
          const startHour = randInt(8, 10);
          const startMin = randInt(10, 35);
          const addMin = randInt(30, 50);
          const rawMin = startMin + addMin;
          const endHour = startHour + Math.floor(rawMin / 60);
          const endMin = rawMin % 60;
          const sentences = [
            `興趣班在上午 ${startHour} 時 ${startMin} 分開始。`,
            `上課時間為 ${addMin} 分鐘。`,
            `請問興趣班會在「上午 ${endHour} 時」過後幾分鐘結束？（填寫分鐘數字）`
          ];
          return {
            type: "unit_cross",
            category: "跨單位進階：1 小時 ＝ 60 分鐘",
            focusTag: "滿 60 分鐘進 1 小時！",
            sentences,
            fullQuestionText: sentences.join(""),
            step1Prompt: `${startMin} 分 ＋ ${addMin} 分 ＝ ${rawMin} 分，已經超過 60 分鐘（1 小時），應該怎麼換算？`,
            step1Options: shuffle([
              { text: `${rawMin} 分 ＝ 1 小時 ${endMin} 分，所以結束時間是上午 ${endHour} 時 ${endMin} 分`, correct: true, tip: `太厲害了！60 分鐘換成 1 小時，剩下的就是 ${endMin} 分。` },
              { text: `結束時間是上午 ${startHour} 時 ${rawMin} 分`, correct: false, tip: `鐘面或時間上滿 60 分鐘要進 1 小時，不會寫 ${rawMin} 分。` },
              { text: `直接用 ${addMin} 減去 ${startMin}`, correct: false, tip: `這是求結束時間，應該把開始時間加上經過時間。` }
            ]),
            diagramSvg: `
              <svg width="100%" height="80" viewBox="0 0 460 80">
                <text x="10" y="28" font-size="13" font-weight="bold">分鐘合計 ${rawMin} 分</text>
                <rect x="145" y="12" width="165" height="24" rx="4" fill="#fde68a" stroke="#d97706"/>
                <text x="227" y="29" font-size="12" text-anchor="middle">60 分 → ＋1 小時（${endHour} 時）</text>
                <rect x="315" y="12" width="130" height="24" rx="4" fill="#bfdbfe" stroke="#2563eb"/>
                <text x="380" y="29" font-size="12" text-anchor="middle">餘 ${endMin} 分</text>
              </svg>
            `,
            step2Prompt: "哪一條算式能求出結束時間的「分鐘」？",
            step2Options: shuffle([
              { text: `(${startMin} + ${addMin}) - 60`, correct: true, tip: `先加出 ${rawMin} 分，減去 1 小時的 60 分，得到 ${endMin} 分。` },
              { text: `${startMin} + ${addMin}`, correct: false, tip: `這還沒減去滿 1 小時的 60 分鐘。` },
              { text: `${addMin} - ${startMin}`, correct: false, tip: `方向相反，應該是相加後再進位。` }
            ]),
            answer: endMin,
            units: ["分鐘", "小時", "秒"],
            correctUnit: "分鐘",
            explanation: `${startMin} + ${addMin} = ${rawMin} 分鐘，${rawMin} - 60 = ${endMin} 分鐘（進 1 小時成上午 ${endHour} 時 ${endMin} 分），故為 ${endMin} 分鐘。`
          };
        }
      }
    };

    function generateProblem() {
      const filter = document.getElementById("typeFilter").value;
      const keys = filter === "all" ? Object.keys(generators) : [filter];
      const chosenKey = pick(keys);
      const prob = generators[chosenKey]();

      state.current = prob;
      state.step1Done = false;
      state.step2Done = false;
      state.step3Done = false;
      state.recordedMistakeThisRound = false;

      document.getElementById("problemCategory").textContent = prob.category;
      document.getElementById("problemFocusTag").textContent = prob.focusTag;

      const pBox = document.getElementById("problemText");
      pBox.innerHTML = prob.sentences
        .map((s, idx) => `<span class="sentence" data-idx="${idx}">${s}</span>`)
        .join(" ");

      pBox.querySelectorAll(".sentence").forEach(span => {
        span.addEventListener("click", () => span.classList.toggle("marked"));
      });

      document.getElementById("step1Box").classList.remove("locked");
      document.getElementById("step1Tag").textContent = "進行中";
      document.getElementById("step1Tag").classList.remove("done");
      document.getElementById("step1Prompt").textContent = prob.step1Prompt;
      document.getElementById("step1Feedback").className = "feedback";
      document.getElementById("step1Feedback").textContent = "";

      const s1Opts = document.getElementById("step1Options");
      s1Opts.innerHTML = "";
      prob.step1Options.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.textContent = opt.text;
        btn.addEventListener("click", () => handleStep1(btn, opt));
        s1Opts.appendChild(btn);
      });

      document.getElementById("step2Box").classList.add("locked");
      document.getElementById("step2Tag").textContent = "未解鎖";
      document.getElementById("step2Tag").classList.remove("done");
      document.getElementById("diagramArea").innerHTML = prob.diagramSvg;
      document.getElementById("step2Prompt").textContent = "請先完成第一步審題，即可解鎖線段圖與列式選擇。";
      document.getElementById("step2Options").innerHTML = "";
      document.getElementById("step2Feedback").className = "feedback";

      document.getElementById("step3Box").classList.add("locked");
      document.getElementById("step3Tag").textContent = "未解鎖";
      document.getElementById("step3Tag").classList.remove("done");
      document.getElementById("step3Prompt").textContent = "請先完成第二步列式，再輸入最終答案。";
      document.getElementById("answerInputRow").style.display = "none";
      document.getElementById("userAnswerInput").value = "";
      document.getElementById("step3Feedback").className = "feedback";

      document.getElementById("solutionBox").className = "solution-box";
      document.getElementById("solutionBox").innerHTML = "";
      document.getElementById("btnNextProblem").disabled = true;
    }

    function handleStep1(btn, opt) {
      if (state.step1Done) return;
      const fb = document.getElementById("step1Feedback");
      fb.classList.add("show");
      if (opt.correct) {
        btn.classList.add("correct");
        fb.className = "feedback show ok";
        fb.textContent = `✅ ${opt.tip}`;
        state.step1Done = true;
        document.getElementById("step1Tag").textContent = "已完成";
        document.getElementById("step1Tag").classList.add("done");
        unlockStep2();
      } else {
        btn.classList.add("wrong");
        fb.className = "feedback show err";
        fb.textContent = `❌ ${opt.tip}`;
        state.streak = 0;
        renderStats();
        recordMistake(opt.tip);
      }
    }

    function unlockStep2() {
      const prob = state.current;
      const box = document.getElementById("step2Box");
      box.classList.remove("locked");
      document.getElementById("step2Tag").textContent = "進行中";
      document.getElementById("step2Prompt").textContent = prob.step2Prompt;

      const s2Opts = document.getElementById("step2Options");
      s2Opts.innerHTML = "";
      prob.step2Options.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.textContent = opt.text;
        btn.addEventListener("click", () => handleStep2(btn, opt));
        s2Opts.appendChild(btn);
      });
    }

    function handleStep2(btn, opt) {
      if (state.step2Done) return;
      const fb = document.getElementById("step2Feedback");
      fb.classList.add("show");
      if (opt.correct) {
        btn.classList.add("correct");
        fb.className = "feedback show ok";
        fb.textContent = `✅ ${opt.tip}`;
        state.step2Done = true;
        document.getElementById("step2Tag").textContent = "已完成";
        document.getElementById("step2Tag").classList.add("done");
        unlockStep3();
      } else {
        btn.classList.add("wrong");
        fb.className = "feedback show err";
        fb.textContent = `❌ ${opt.tip}`;
        state.streak = 0;
        renderStats();
        recordMistake(opt.tip);
      }
    }

    function unlockStep3() {
      const prob = state.current;
      const box = document.getElementById("step3Box");
      box.classList.remove("locked");
      document.getElementById("step3Tag").textContent = "進行中";
      document.getElementById("step3Prompt").textContent = "請輸入正確數字並選擇單位：";
      document.getElementById("answerInputRow").style.display = "flex";

      const unitSel = document.getElementById("userUnitSelect");
      unitSel.innerHTML = prob.units.map(u => `<option value="${u}">${u}</option>`).join("");
    }

    document.getElementById("btnCheckAnswer").addEventListener("click", () => {
      if (state.step3Done || !state.current) return;
      const prob = state.current;
      const numVal = Number(document.getElementById("userAnswerInput").value);
      const unitVal = document.getElementById("userUnitSelect").value;
      const fb = document.getElementById("step3Feedback");
      fb.classList.add("show");

      if (numVal === prob.answer && unitVal === prob.correctUnit) {
        fb.className = "feedback show ok";
        fb.textContent = `🎉 完全正確！答案是 ${prob.answer} ${prob.correctUnit}。`;
        state.step3Done = true;
        document.getElementById("step3Tag").textContent = "已完成";
        document.getElementById("step3Tag").classList.add("done");

        state.solved += 1;
        state.streak += 1;
        state.stars += state.recordedMistakeThisRound ? 1 : 2;
        saveState();
        renderStats();

        const solBox = document.getElementById("solutionBox");
        solBox.className = "solution-box show";
        solBox.innerHTML = `
          <strong>💡 完整解題解析：</strong><br/>
          ${prob.explanation}<br/>
          <strong>答：</strong>答案是 ${prob.answer}${prob.correctUnit}。
        `;
        document.getElementById("btnNextProblem").disabled = false;
      } else if (numVal === prob.answer && unitVal !== prob.correctUnit) {
        fb.className = "feedback show err";
        fb.textContent = `⚠️ 數字算對了，但單位選錯了！再看一次題目問的是什麼單位。`;
        state.streak = 0;
        renderStats();
        recordMistake(`數字算對（${numVal}），但單位選錯（選了「${unitVal}」，應為「${prob.correctUnit}」）。`);
      } else {
        fb.className = "feedback show err";
        fb.textContent = `❌ 數字還未正確，請再細心計算一次！`;
        state.streak = 0;
        renderStats();
        recordMistake(`計算結果有誤（輸入 ${numVal || "空白"}，正確為 ${prob.answer} ${prob.correctUnit}）。`);
      }
    });

    document.getElementById("btnNewProblem").addEventListener("click", generateProblem);
    document.getElementById("btnNextProblem").addEventListener("click", generateProblem);
    document.getElementById("typeFilter").addEventListener("change", generateProblem);
    document.getElementById("btnResetStats").addEventListener("click", () => {
      state.solved = 0;
      state.streak = 0;
      state.stars = 0;
      state.mistakes = [];
      saveState();
      renderStats();
      renderMistakes();
    });

    loadState();
    generateProblem();
  </script>
</body>
</html>
